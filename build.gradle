
plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

group = 'de.horizon'
version = '0.1.0'

def targetMinecraftVersion = '26.1.2'
def fabricApiVersion = '0.151.0+26.1.2'

def defaultPrismModsDirs = [
    '26.1.2': 'C:/Users/marvi/AppData/Roaming/PrismLauncher/instances/26.1.2/minecraft/mods'
]
def prismModsDir = providers.gradleProperty('prismModsDir')
    .orElse(defaultPrismModsDirs.get(targetMinecraftVersion, ''))
    .get()

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraftVersion}"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    implementation "com.github.oshi:oshi-core:6.6.5"
}

processResources {
    inputs.property 'mod_version', project.version
    filesMatching('fabric.mod.json') {
        expand(
            mod_version: project.version
        )
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def deployToPrismMods = tasks.register('deployToPrismMods') {
    dependsOn tasks.named('jar')
    onlyIf {
        prismModsDir != null && !prismModsDir.isBlank()
    }
    doLast {
        def modsDir = file(prismModsDir)
        modsDir.mkdirs()
        try {
            delete fileTree(modsDir) {
                include 'horizon-mod-*.jar'
            }
            copy {
                from tasks.named('jar').flatMap { it.archiveFile }
                into modsDir
            }
            logger.lifecycle("Deployed ${tasks.named('jar').get().archiveFileName.get()} to ${modsDir}")
        } catch (Exception exception) {
            logger.warn("Could not deploy Horizon jar to ${modsDir}. The file is likely locked by a running Minecraft instance. Close the game and run build again to update the mods folder automatically.")
        }
    }
}

def copyJarToBuildRoot = tasks.register('copyJarToBuildRoot') {
    dependsOn tasks.named('jar')
    doLast {
        copy {
            from tasks.named('jar').flatMap { it.archiveFile }
            into layout.buildDirectory
        }
    }
}

tasks.named('build') {
    finalizedBy(copyJarToBuildRoot)
    finalizedBy(deployToPrismMods)
}
